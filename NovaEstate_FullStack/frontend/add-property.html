<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaEstate — Add Property</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <header class="topbar" id="topbar"></header>

      <!-- Page Heading -->
      <section class="page-heading">
        <div>
          <span class="eyebrow">PROPERTY STUDIO</span>
          <h1>
            Add a <span>new property.</span>
          </h1>
          <p>Create a polished listing and publish it instantly.</p>
        </div>
      </section>

      <!-- Property Form -->
      <form id="propertyForm" class="editor-layout">

        <!-- Property Information -->
        <div class="form-card">
          <h3>Property information</h3>
          <div class="form-grid">
            <label>
              Property title
              <input name="title" required placeholder="Modern Sky Villa">
            </label>
            <label>
              Property type
              <select name="type">
                <option>Apartment</option>
                <option>Villa</option>
                <option>House</option>
                <option>Commercial</option>
              </select>
            </label>
            <label>
              Purpose
              <select name="purpose">
                <option>For Sale</option>
                <option>For Rent</option>
              </select>
            </label>
            <label>
              Price (₹)
              <input name="price" type="number" required placeholder="12500000">
            </label>
            <label>
              City
              <input name="city" required placeholder="Hyderabad">
            </label>
            <label>
              Area / locality
              <input name="area" required placeholder="Gachibowli">
            </label>
            <label>
              Bedrooms
              <input name="beds" type="number" min="0" value="2">
            </label>
            <label>
              Bathrooms
              <input name="baths" type="number" min="0" value="2">
            </label>
            <label>
              Area (sq.ft)
              <input name="sqft" type="number" value="1500">
            </label>
            <label>
              Image URL
              <input name="image" placeholder="https://images.unsplash.com/...">
            </label>
            <label class="full">
              Description
              <textarea name="description" rows="5" placeholder="Describe the property..."></textarea>
            </label>
          </div>
        </div>

        <!-- Location Information -->
        <div class="form-card sticky-card">
          <h3>Location</h3>
          <p class="muted">Optional coordinates let the property appear precisely on the map.</p>
          <div class="form-grid">
            <label>
              Latitude
              <input name="lat" type="number" step="any" placeholder="17.4401">
            </label>
            <label>
              Longitude
              <input name="lng" type="number" step="any" placeholder="78.3489">
            </label>
          </div>
          <div class="location-tip">⌖ Use Smart Map to detect your current coordinates.</div>

          <!-- Form Actions -->
          <button class="btn btn-primary btn-full" type="submit">Publish property ↗</button>
          <a class="btn btn-glass btn-full" href="properties.html">Cancel</a>
        </div>
      </form>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/add-property.js"></script>
</body>
</html>
