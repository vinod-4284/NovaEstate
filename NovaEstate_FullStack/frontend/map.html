<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaEstate — Smart Map</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet Styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <header class="topbar" id="topbar"></header>

      <!-- Page Heading -->
      <section class="page-heading">
        <div>
          <span class="eyebrow">LOCATION INTELLIGENCE</span>
          <h1>
            Your world, <span>mapped.</span>
          </h1>
          <p>Enable location access to find your position and explore nearby properties.</p>
        </div>
        <button class="btn btn-primary" id="locateBtn">⌖ Detect my location</button>
      </section>

      <!-- Map Layout -->
      <section class="map-layout">
        <div id="map"></div>

        <!-- Map Side Panel -->
        <aside class="map-side">
          <div class="status-card">
            <span class="status-dot" id="statusDot"></span>
            <div>
              <b id="locationStatus">Location not detected</b>
              <small id="coords">Allow browser location access.</small>
            </div>
          </div>

          <div class="map-info">
            <span class="eyebrow">NEARBY PROPERTIES</span>
            <h3>Explore the area</h3>
            <div id="nearbyList"></div>
          </div>

          <div class="privacy-note">
            ⌁ <b>Privacy first.</b> Location is used only in this browser session.
          </div>
        </aside>
      </section>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
