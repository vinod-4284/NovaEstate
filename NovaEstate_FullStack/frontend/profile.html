<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaEstate — Profile</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <header class="topbar" id="topbar"></header>

      <!-- Profile Hero -->
      <section class="profile-hero">
        <div class="avatar avatar-xl" id="profileAvatar">V</div>
        <div>
          <span class="eyebrow">ACCOUNT CENTER</span>
          <h1 id="profileName">Vinod</h1>
          <p id="profileEmail"></p>
        </div>
        <span class="verified">✓ Verified account</span>
      </section>

      <!-- Profile Grid -->
      <section class="profile-grid">

        <!-- Personal Details -->
        <div class="form-card">
          <div class="section-head">
            <div>
              <span class="eyebrow">PERSONAL DETAILS</span>
              <h2>Your profile</h2>
            </div>
          </div>
          <form id="profileForm" class="form-grid">
            <label>
              Full name
              <input name="name" required>
            </label>
            <label>
              Email
              <input name="email" type="email" required>
            </label>
            <label>
              Phone
              <input name="phone">
            </label>
            <label>
              City
              <input name="city">
            </label>
            <label class="full">
              Bio
              <textarea name="bio" rows="4"></textarea>
            </label>
            <button class="btn btn-primary" type="submit">Save profile</button>
          </form>
        </div>

        <!-- Account Preferences -->
        <div class="form-card">
          <span class="eyebrow">ACCOUNT</span>
          <h3>Preferences</h3>

          <div class="setting">
            <div>
              <b>Property alerts</b>
              <small>Receive matching property updates</small>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>

          <div class="setting">
            <div>
              <b>Location services</b>
              <small>Enable nearby recommendations</small>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>

          <div class="setting">
            <div>
              <b>Dark interface</b>
              <small>Futuristic dark experience</small>
            </div>
            <label class="switch">
              <input type="checkbox" checked disabled>
              <span></span>
            </label>
          </div>

          <hr>

          <button class="btn btn-danger btn-full" id="logoutBtn">↪ Log out</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
